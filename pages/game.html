    <!-- Deferred Execution Script -->
    <script defer>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        const JSON_FEED_PATH = '../data/all.json';

        let allGamesData = [];

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // Set current year
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Cache configuration
        const CACHE_KEY = 'bekeiratGameData';
        const CACHE_TTL = 24 * 60 * 60 * 1000; // 24 hours

        async function getCachedData() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const { data, timestamp } = JSON.parse(cached);
                    if (Date.now() - timestamp < CACHE_TTL) {
                        return data;
                    }
                }
            } catch (e) {
                console.warn('Cache read error:', e);
            }
            return null;
        }

        async function setCachedData(data) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    data,
                    timestamp: Date.now()
                }));
            } catch (e) {
                console.warn('Cache write error:', e);
            }
        }

        async function loadGameData() {
            if (!gameId) {
                showError("No Game ID specified in the URL. Please return to the games list and select a game.");
                return;
            }

            try {
                // Check cache first
                const cached = await getCachedData();
                if (cached && cached.length > 0) {
                    allGamesData = cached;
                    const gameData = cached.find(g => String(g.id) === String(gameId) || String(g.gameId) === String(gameId));
                    if (gameData) {
                        renderGamePage(gameData);
                        return;
                    }
                }

                // Simulate brief delay for loading effect
                await new Promise(resolve => setTimeout(resolve, 300));

                // Try primary data file
                let response;
                try {
                    response = await fetch(JSON_FEED_PATH, { cache: 'force-cache' });
                } catch (e) {
                    console.warn('Primary fetch failed, trying fallback:', e);
                }

                if (!response || !response.ok) {
                    // Single fallback instead of multiple
                    try {
                        response = await fetch('./data/all.json', { cache: 'force-cache' });
                    } catch (e) {
                        console.warn('Fallback fetch also failed:', e);
                    }
                }

                if (response && response.ok) {
                    const games = await response.json();
                    allGamesData = Array.isArray(games) ? games : [];
                    
                    // Cache the data
                    if (allGamesData.length > 0) {
                        await setCachedData(allGamesData);
                    }

                    const gameData = allGamesData.find(g => String(g.id) === String(gameId) || String(g.gameId) === String(gameId));
                    if (gameData) {
                        renderGamePage(gameData);
                        return;
                    }
                }

                showError(`Game ID "${gameId}" was not found inside the database. Please verify the game exists.`);
            } catch (err) {
                showError(`Failed to load game database. Error: ${err.message}`);
                console.error("Fetch error details:", err);
            }
        }

        function renderGamePage(game) {
            const title = game.Title || game.title || game.name || "Untitled Game";
            const description = game.Description || game.description || game.desc || "No description provided.";
            const category = game.Category || game.category || game.genre || "Arcade";
            const tags = game.Tags || game.tags || game.keywords || "";
            const thumb = game.Image || game.thumb || game.thumbnail || game.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
            const id = game.id || game.gameId || gameId;

            // Use the Embed HTML if provided, otherwise fallback to Url
            let embedCode = game.Embed;
            if (!embedCode) {
                const url = game.Url || game.Play || game.url || game.gameUrl || game.link || "";
                embedCode = `<iframe id="game-iframe" src="${url}" allow="autoplay; fullscreen; encrypted-media; accelerometer; gyroscope" allowfullscreen="true" scrolling="no" loading="lazy"></iframe>`;
            }

            let formattedDesc = String(description).replace(/&ndash;/g, '-').replace(/&amp;/g, '&').replace(/\*\*/g, '');

            // Render Categories
            const categoriesArray = String(category).split(',').map(c => c.trim()).filter(c => c !== '');
            let categoriesHtml = '';
            categoriesArray.forEach(cat => {
                categoriesHtml += `<a href="./games.html?category=${encodeURIComponent(cat)}" class="category-badge"><i class="fa-solid fa-gamepad mr-2 opacity-70"></i>${escapeHtml(cat)}</a>`;
            });

            // Render Tags
            const tagsArray = String(tags).split(',').map(tag => tag.trim()).filter(tag => tag !== '');
            let tagsHtml = '';
            if (tagsArray.length > 0) {
                tagsArray.forEach(tag => {
                    tagsHtml += `<a href="./games.html?tag=${encodeURIComponent(tag)}" class="tag-badge"><i class="fa-solid fa-hashtag mr-1 text-blue-400"></i>${escapeHtml(tag)}</a>`;
                });
            } else {
                tagsHtml = `<a href="./games.html?tag=HTML5" class="tag-badge"><i class="fa-brands fa-html5 mr-1 text-orange-500"></i>HTML5</a>`;
            }

            // Get related games (same category or random)
            let relatedGames = allGamesData.filter(g =>
                (String(g.id) !== String(id) && String(g.gameId) !== String(id)) &&
                (String(g.Category || g.category || g.genre).includes(categoriesArray[0]))
            );

            if (relatedGames.length < 6) {
                const otherGames = allGamesData.filter(g => String(g.id) !== String(id) && String(g.gameId) !== String(id));
                const needed = 6 - relatedGames.length;
                for (let i = 0; i < needed && i < otherGames.length; i++) {
                    if (!relatedGames.includes(otherGames[i])) {
                        relatedGames.push(otherGames[i]);
                    }
                }
            }

            // Generate CSS Grid items with lazy loading
            let gridItemsHtml = '';
            relatedGames.slice(0, 6).forEach(rg => {
                const rgThumb = rg.Image || rg.thumb || rg.thumbnail || rg.image || "https://placehold.co/512x384/1e293b/60a5fa?text=Game";
                const rgTitle = rg.Title || rg.title || rg.name || "Game";
                const rgId = rg.id || rg.gameId;

                gridItemsHtml += `
                    <a href="?id=${encodeURIComponent(rgId)}" class="group relative block rounded-2xl overflow-hidden shadow-md border border-slate-700 hover:border-blue-500 hover:shadow-[0_0_15px_rgba(59,130,246,0.3)] transition-all duration-300">
                        <img src="${escapeHtml(rgThumb)}" alt="${escapeHtml(rgTitle)}" loading="lazy" decoding="async" class="w-full h-24 object-cover transition-transform duration-500 group-hover:scale-110" onerror="this.src='https://placehold.co/512x384/1e293b/60a5fa?text=${encodeURIComponent(rgTitle)}'">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                        <div class="absolute bottom-0 w-full p-2 text-center">
                            <h3 class="text-[11px] font-bold text-gray-100 truncate drop-shadow-md group-hover:text-blue-300 transition-colors">${escapeHtml(rgTitle)}</h3>
                        </div>
                    </a>
                `;
            });

            const htmlContent = `
                <div class="max-w-[1400px] mx-auto px-4 md:px-8 py-10 w-full">
                    <div class="animate-fade-in flex items-center gap-6 mb-8">
                        <img src="${escapeHtml(thumb)}" alt="${escapeHtml(title)}" class="w-24 h-24 md:w-28 md:h-28 rounded-2xl shadow-2xl border border-blue-500/30 object-cover hidden sm:block bg-slate-900" loading="lazy" decoding="async" onerror="this.src='https://placehold.co/400x400/1e293b/60a5fa?text=${encodeURIComponent(title)}'">
                        <div>
                            <h1 class="text-3xl md:text-5xl font-black text-white mb-3 tracking-tight drop-shadow-lg font-poppins">${escapeHtml(title)}</h1>
                            <div class="flex flex-wrap gap-2">
                                ${categoriesHtml}
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col lg:flex-row gap-8">
                        <div class="lg:w-2/3 flex flex-col gap-8">
                            <div class="relative group w-full rounded-3xl overflow-hidden shadow-[0_0_40px_rgba(59,130,246,0.15)] border border-blue-500/30 bg-[#050505] aspect-video animate-slide-up" style="animation-delay: 0.1s;">
                                <div class="absolute -top-16 left-1/2 -translate-x-1/2 w-3/4 h-32 bg-blue-500/20 blur-[60px] pointer-events-none z-0"></div>
                                <div class="relative z-10 w-full h-full game-frame-wrapper">
                                    ${embedCode}
                                </div>
                                <div class="absolute top-4 right-4 z-20 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                    <button onclick="const f = document.getElementById('game-iframe') || document.querySelector('.game-frame-wrapper iframe'); if(f) { if(f.requestFullscreen) f.requestFullscreen(); else if(f.webkitRequestFullscreen) f.webkitRequestFullscreen(); }"
                                        class="bg-black/60 hover:bg-blue-600 backdrop-blur-md text-white px-4 py-2.5 rounded-xl border border-white/10 transition-all shadow-lg flex items-center gap-2 group/btn cursor-pointer" title="Enter Fullscreen">
                                        <i class="fa-solid fa-expand group-hover/btn:scale-110 transition-transform"></i>
                                        <span class="text-xs font-bold tracking-wider hidden sm:block">FULLSCREEN</span>
                                    </button>
                                </div>
                            </div>

                            <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 md:p-8 animate-slide-up shadow-xl" style="animation-delay: 0.2s;">
                                <h2 class="font-poppins text-xl font-bold text-blue-400 border-b border-slate-700/60 pb-3 mb-5 flex items-center">
                                    <i class="fa-solid fa-align-left mr-3"></i> Game Description
                                </h2>
                                <p class="text-slate-300 leading-relaxed text-[15px]">${escapeHtml(formattedDesc)}</p>
                            </div>
                            
                            <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 md:p-8 animate-slide-up shadow-xl" style="animation-delay: 0.3s;">
                                <h2 class="font-poppins text-xl font-bold text-purple-400 border-b border-slate-700/60 pb-3 mb-5 flex items-center">
                                    <i class="fa-solid fa-tags mr-3"></i> Tags & Features
                                </h2>
                                <div class="flex flex-wrap gap-2">
                                    ${tagsHtml}
                                </div>
                            </div>
                        </div>

                        <div class="lg:w-1/3 flex flex-col gap-8">
                            <div class="sm:hidden animate-slide-up" style="animation-delay: 0.1s;">
                                 <img src="${escapeHtml(thumb)}" alt="${escapeHtml(title)}" class="w-full h-auto rounded-3xl shadow-lg border border-blue-500/30 object-cover aspect-video bg-slate-900" loading="lazy" decoding="async" onerror="this.src='https://placehold.co/400x400/1e293b/60a5fa?text=${encodeURIComponent(title)}'">
                            </div>
                            <div class="sticky top-24 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 md:p-8 animate-slide-up shadow-xl" style="animation-delay: 0.4s;">
                                <h2 class="font-poppins text-lg font-bold text-orange-400 border-b border-slate-700/60 pb-3 mb-5 flex items-center">
                                    <i class="fa-solid fa-fire mr-3"></i> You May Also Like
                                </h2>
                                <div class="grid grid-cols-2 gap-3">
                                    ${gridItemsHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app-container').innerHTML = htmlContent;
            document.title = escapeHtml(title) + " - Bekeirat Software";
        }

        function showError(message) {
            document.getElementById('app-container').innerHTML = `
                <div class="py-32 flex flex-col items-center text-center animate-slide-up px-4">
                    <div class="bg-red-500/10 p-6 rounded-full border border-red-500/20 mb-6">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-red-500 drop-shadow-md"></i>
                    </div>
                    <h2 class="text-3xl font-extrabold text-white mb-4 font-poppins">Oops! Something went wrong.</h2>
                    <p class="text-slate-300 max-w-lg mx-auto text-lg mb-8 leading-relaxed">${escapeHtml(message)}</p>
                    <a href="../index.html" class="inline-flex items-center gap-2 px-8 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg hover:bg-blue-500 transform hover:-translate-y-1 transition-all duration-300">
                        <i class="fa-solid fa-arrow-left"></i> Return Home
                    </a>
                </div>
            `;
        }

        function escapeHtml(s) {
            return String(s || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        // Initialize application
        window.onload = loadGameData;
    </script>
